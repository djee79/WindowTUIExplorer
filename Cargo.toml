[package]
name = "sentier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
image = "0.25"
kamadak-exif = "0.6.2"
nucleo = "0.5.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
toml = "1.2.0"
trash = "5.3.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WNet", "Win32_System_WinRT", "Foundation", "Data_Pdf", "Storage_Streams", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_Globalization", "Win32_System_Registry"] }
zeroize = "1.9.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
arboard = { version = "3.7.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
# panic = "abort" waits until the panic hook is verified to restore the terminal.

# Debug builds: optimize the dependencies (image decoding, PNG encoding, matching) but not
# sentier itself. Unoptimized `image` takes seconds on a 3000 px PNG.
[profile.dev.package."*"]
opt-level = 3
